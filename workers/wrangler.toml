name = "gift-happiness-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Not deployed yet. Once a Cloudflare account + Supabase project exist:
#   1. `wrangler login`
#   2. `wrangler secret put SUPABASE_SERVICE_ROLE_KEY`
#   3. `wrangler secret put ADMIN_API_KEY`
#   4. Fill in SUPABASE_URL and ALLOWED_ORIGIN below (these are not secret).
#   5. `npm run deploy`

[vars]
SUPABASE_URL = "https://YOUR-PROJECT.supabase.co"
ALLOWED_ORIGIN = "https://gifthappiness.example"

# Secrets (set via `wrangler secret put`, never committed):
#   SUPABASE_SERVICE_ROLE_KEY - Supabase service role key, bypasses RLS; Worker-only.
#   ADMIN_API_KEY             - shared secret for admin-only routes until a real
#                               admin-auth strategy is picked (see docs/plan.md
#                               CMS/Admin Direction).
