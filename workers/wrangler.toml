name = "gift-happiness-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Deployed: https://gift-happiness-api.nikhil-shahane.workers.dev (see
# docs/plan.md Phase 5). ALLOWED_ORIGIN is still the local dev origin below
# until a production frontend domain exists -- update it then.
#
# To redeploy after code changes: `npm run deploy` from workers/.
# Secrets already set (`wrangler secret put ...`) don't need to be re-set
# unless they change.

[vars]
SUPABASE_URL = "https://fsradcbnqocpvxqwizdt.supabase.co"
# CORS is single-origin only (see workers/src/lib/response.ts corsHeaders) --
# this only allows the Production Pages URL. Cloudflare Pages Preview
# deployments (random <hash>.gifthappiness.pages.dev subdomains) will be
# CORS-blocked until corsHeaders supports multiple/wildcard origins; local
# dev also needs a manual switch back to http://localhost:3000 for now.
ALLOWED_ORIGIN = "https://gifthappiness.pages.dev"

# Public site origin used to build links inside emails. Kept separate from
# ALLOWED_ORIGIN (a CORS control) so the two can differ in local development.
SITE_URL = "https://gifthappiness.pages.dev"

# Verified Resend sending domain. A subdomain, not the root: the root's MX
# records belong to whichever mailbox provider receives human mail, and
# Resend wants its own MX for bounce handling -- putting both on the root
# collides. Also isolates transactional sending reputation from the root.
EMAIL_DOMAIN = "mail.gifthappiness.org"

# Reply-To on every outbound email. Deliberately a no-reply address for now:
# no monitored mailbox exists yet, and a reply-to that silently bounces is
# worse than one that visibly signals "don't reply here". Swap to
# hello@gifthappiness.org once that inbox is set up on the root domain.
EMAIL_REPLY_TO = "no-reply@mail.gifthappiness.org"

# Secrets (set via `wrangler secret put`, never committed):
#   SUPABASE_SERVICE_ROLE_KEY - Supabase service role key, bypasses RLS; Worker-only.
#   ADMIN_API_KEY             - shared secret for admin-only routes until a real
#                               admin-auth strategy is picked (see docs/plan.md
#                               CMS/Admin Direction).
#   RESEND_API_KEY            - Resend API key for all outbound mail (see
#                               workers/src/lib/email.ts). Sends from the
#                               verified EMAIL_DOMAIN above; sending addresses
#                               (noreply@, celebrations@, alerts@) need no
#                               provisioning -- any local part at a verified
#                               domain works immediately.
